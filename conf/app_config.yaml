logging:
  file:
    enable: true
    level: INFO
    path: logs
    rotation: "10 MB"
    retention: "7 days"
  console:
    enable: true
    level: INFO

db_meta:
  host: ${oc.env:MYSQL_HOST,localhost}
  port: ${oc.env:MYSQL_PORT,3306}
  user: ${oc.env:MYSQL_USER,shopkeeper}
  password: ${oc.env:MYSQL_PASSWORD,shopkeeper_dev}
  database: ${oc.env:MYSQL_META_DATABASE,meta}

# 数仓查询默认可改为只读账号；未配置 MYSQL_DW_USER 时仍用初始 shopkeeper（与 meta 相同）。
# 创建 shopkeeper_ro 后设 MYSQL_DW_USER=shopkeeper_ro，不影响 MYSQL_USER/meta 写入账号。
db_dw:
  host: ${oc.env:MYSQL_HOST,localhost}
  port: ${oc.env:MYSQL_PORT,3306}
  user: ${oc.env:MYSQL_DW_USER,shopkeeper}
  password: ${oc.env:MYSQL_DW_PASSWORD,shopkeeper_dev}
  database: ${oc.env:MYSQL_DW_DATABASE,dw}

qdrant:
  host: localhost
  port: 6333
  embedding_size: 1024

embedding:
  host: localhost
  port: 8081
  model: BAAI/bge-large-zh-v1.5

es:
  host: localhost
  port: 9200
  index_name: value_index

redis:
  url: ${oc.env:REDIS_URL,redis://localhost:6379/0}
  checkpoint_ttl_minutes: ${oc.env:REDIS_CHECKPOINT_TTL_MINUTES,10080}
  refresh_on_read: true
  connect_timeout_seconds: 5
  operation_timeout_seconds: 10
  startup_retries: 5
  retry_delay_seconds: 1
  recent_message_limit: 12
  hydration_message_limit: 50
  summary_max_chars: 2400
  delete_retry_interval_seconds: 5
  delete_retry_max_attempts: 8

sql_exec:
  max_rows: 1000
  query_timeout_seconds: 30
  max_concurrent_queries: 4

llm:
  model_name: deepseek-v4-flash
  api_key: ${oc.env:LLM_API_KEY}
  base_url: https://api.deepseek.com
