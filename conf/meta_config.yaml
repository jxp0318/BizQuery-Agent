tables:
  - name: dim_region
    role: dim
    description: 地区维度表，用于描述订单发生的地理区域信息。
    columns:
      - name: region_id
        role: primary_key
        description: 地区唯一标识。
        alias: [地区ID, 区域ID]
        sync: false

      - name: province
        role: dimension
        description: 订单所属的省份名称。
        alias: [省份, 省, 所在省份]
        sync: true

      - name: region_name
        role: dimension
        description: 订单所属的大区名称，如华东、华南等。
        alias: [地区, 区域, 大区]
        sync: true

      - name: country
        role: dimension
        description: 地区所属国家名称。
        alias: [国家, 国家名称]
        sync: true

  - name: dim_customer
    role: dim
    description: 客户维度表，描述下单客户的基本属性。
    columns:
      - name: customer_id
        role: primary_key
        description: 客户唯一标识。
        alias: [客户ID, 用户ID]
        sync: false

      - name: customer_name
        role: dimension
        description: 客户名称。
        alias: [客户名称, 用户名称]
        sync: true

      - name: gender
        role: dimension
        description: 客户性别。
        alias: [性别]
        sync: true

      - name: member_level
        role: dimension
        description: 客户会员等级。
        alias: [会员等级, 用户等级]
        sync: true

  - name: dim_product
    role: dim
    description: 商品维度表，描述商品的基本属性信息。
    columns:
      - name: product_id
        role: primary_key
        description: 商品唯一标识。
        alias: [商品ID, 产品ID]
        sync: false

      - name: product_name
        role: dimension
        description: 商品名称。
        alias: [商品名称, 产品名称]
        sync: true

      - name: category
        role: dimension
        description: 商品所属品类。
        alias: [商品类别, 品类, 分类]
        sync: true

      - name: brand
        role: dimension
        description: 商品品牌名称。
        alias: [品牌, 品牌名称]
        sync: true

  - name: dim_date
    role: dim
    description: 时间维度表，用于多时间粒度分析。
    columns:
      - name: date_id
        role: primary_key
        description: 日期唯一标识，格式 yyyyMMdd；用于时间范围过滤和同比对比。
        alias: [日期ID, 日期, 时间]
        sync: false

      - name: year
        role: dimension
        description: 年份；支持同比、去年同期、全年汇总等时间对比。
        alias: [年, 年份, 同比年, 去年]
        sync: false

      - name: quarter
        role: dimension
        description: 季度（Q1～Q4）。
        alias: [季度, Q]
        sync: true

      - name: month
        role: dimension
        description: 月份；用于按月趋势、环比、同比对比。
        alias: [月, 月份, 月份趋势]
        sync: false

      - name: day
        role: dimension
        description: 日。
        alias: [日, 天]
        sync: false

  - name: fact_order
    role: fact
    description: 订单事实表，记录订单数量和金额等核心指标。
    columns:
      - name: order_id
        role: primary_key
        description: 订单唯一标识。
        alias: [订单ID]
        sync: false

      - name: customer_id
        role: foreign_key
        description: 关联客户维度的外键。
        alias: [客户ID, 用户ID]
        sync: false

      - name: product_id
        role: foreign_key
        description: 关联商品维度的外键。
        alias: [商品ID, 产品ID]
        sync: false

      - name: date_id
        role: foreign_key
        description: 关联时间维度的外键。
        alias: [日期, 下单日期]
        sync: false

      - name: region_id
        role: foreign_key
        description: 关联地区维度的外键。
        alias: [地区ID, 区域ID]
        sync: false

      - name: order_quantity
        role: measure
        description: 订单中商品的购买数量。
        alias: [销量, 购买数量, 件数]
        sync: false

      - name: order_amount
        role: measure
        description: 订单金额。
        alias: [销售额, 订单金额, 收入]
        sync: false

      - name: order_status
        role: dimension
        description: 订单状态；已支付为有效销售，已退款/已取消不应计入净销售分析。
        alias: [订单状态, 状态, 是否退款, 退款状态]
        sync: true

metrics:
  - name: GMV
    description: 全称 Gross Merchandise Value，全部订单成交金额总和（毛额）。不过滤 order_status，不剔除退款与取消。仅当用户明确要求排除退款、净销售或只统计已支付时才使用净GMV。
    relevant_columns:
      - fact_order.order_amount
    alias: [成交总额, 订单总额, 销售额, 总销售额]

  - name: AOV
    description: 全称 Average Order Value，全部订单的平均订单金额（毛额口径，不筛选 order_status）。
    relevant_columns:
      - fact_order.order_amount
      - fact_order.order_id
    alias: [平均单价, 平均订单金额, 客单价]

  - name: 净GMV
    description: 排除退款和取消订单后的销售额，仅统计 order_status=已支付。
    relevant_columns:
      - fact_order.order_amount
      - fact_order.order_status
    alias: [净销售, 净销售额, 有效GMV, 排除退款GMV]

  - name: 退款率
    description: 退款订单占全部订单的比例；退款订单对应 order_status=已退款。
    relevant_columns:
      - fact_order.order_id
      - fact_order.order_status
    alias: [退款占比, 退货率]
